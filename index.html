function attachLongPress(el, cb){
  let timer = null, sx = 0, sy = 0;
  const start = (x, y) => { clearTimeout(timer); sx = x; sy = y; timer = setTimeout(() => { timer = null; cb(); }, 2500); };
  const move = (x, y) => { if(timer && (Math.abs(x - sx) > 15 || Math.abs(y - sy) > 15)){ clearTimeout(timer); timer = null; } };
  const cancel = () => { clearTimeout(timer); timer = null; };
  // touch (mobile)
  el.addEventListener('touchstart', e => { const t = e.touches[0]; start(t.clientX, t.clientY); }, {passive:true});
  el.addEventListener('touchmove', e => { const t = e.touches[0]; move(t.clientX, t.clientY); }, {passive:true});
  el.addEventListener('touchend', cancel);
  el.addEventListener('touchcancel', cancel);
  // mouse (desktop)
  el.addEventListener('mousedown', e => start(e.clientX, e.clientY));
  el.addEventListener('mousemove', e => move(e.clientX, e.clientY));
  el.addEventListener('mouseup', cancel);
  el.addEventListener('mouseleave', cancel);
}

const scr = { pdf: document.getElementById('screen-pdf'), chat: document.getElementById('screen-chat') };

  let logged = false; try{ logged = localStorage.getItem('kk_logged') === '1' && !!localStorage.getItem('kk_user'); }catch(e){}
  if(logged){ identity = localStorage.getItem('kk_user'); show('chat'); return; }

document.getElementById('chatBack').addEventListener('click', () => show('pdf'));

/* ---------- CHAT ---------- */
const msgsEl = document.getElementById('msgs');
const chatForm = document.getElementById('chatForm');
const txt = document.getElementById('txt');
const fileIn = document.getElementById('file');
const prev = document.getElementById('prev');
let pendingFile = null, chatChannel = null, pollTimer = null, lastTs = null;
const EMPTY = '<p class="empty">Abhi koi message nahi — sabse pehle tum bolo 👋</p>';

document.getElementById('attach').addEventListener('click', () => fileIn.click());
fileIn.addEventListener('change', () => {
  const f = fileIn.files[0]; if(!f) return;
  pendingFile = f;
  document.getElementById('prevNm').textContent = f.name;
  const th = document.getElementById('prevTh'); th.innerHTML = '';
  if(f.type.startsWith('image/')){ const im = document.createElement('img'); im.src = URL.createObjectURL(f); th.appendChild(im); }
  else th.textContent = '🎬';
  prev.style.display = 'flex';
});
document.getElementById('prevRm').addEventListener('click', clearPending);
function clearPending(){ pendingFile = null; fileIn.value = ''; prev.style.display = 'none'; }
function toBottom(){ msgsEl.scrollTop = msgsEl.scrollHeight; }
function pathFromUrl(u){ const i = u.indexOf('/' + BUCKET + '/'); return i === -1 ? null : u.slice(i + BUCKET.length + 2); }

function buildBubble(m){
  const mine = m.sender === identity;
  const w = document.createElement('div');
  w.className = 'b ' + (mine ? 'me' : 'them');
  if(!mine){ const who = document.createElement('div'); who.className = 'who'; who.textContent = m.sender; w.appendChild(who); }
  if(m.media_url){
    const md = document.createElement('div'); md.className = 'media';
    if(m.media_type === 'video'){ const v = document.createElement('video'); v.src = m.media_url; v.muted = true; v.playsInline = true; v.preload = 'metadata'; md.appendChild(v); }
    else { const im = document.createElement('img'); im.src = m.media_url; im.loading = 'lazy'; md.appendChild(im); }
    md.addEventListener('click', () => openLb(m.media_url, m.media_type));
    w.appendChild(md);
  }
  if(m.content){ const b = document.createElement('div'); b.className = 'bb'; b.textContent = m.content; w.appendChild(b); }
  const foot = document.createElement('div'); foot.className = 'foot';
  const t = document.createElement('div'); t.className = 'time';
  t.textContent = new Date(m.created_at).toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit'});
  foot.appendChild(t);
  if(mine){
    const d = document.createElement('button'); d.type = 'button'; d.className = 'del'; d.textContent = '🗑';
    d.addEventListener('click', () => deleteOne(m, w));
    foot.appendChild(d);
  }
  w.appendChild(foot);
  return w;
}

async function deleteOne(m, el){
  if(!sb || !confirm('Yeh message sabke liye delete karna hai?')) return;
  try{
    if(m.media_url){ const p = pathFromUrl(m.media_url); if(p) await sb.storage.from(BUCKET).remove([p]); }
    const { error } = await sb.from('messages').delete().eq('id', m.id);
    if(error) throw error;
    el.remove();
    if(!msgsEl.querySelector('.b')) msgsEl.innerHTML = EMPTY;
  } catch(err){ console.error(err); alert('Message delete nahi ho paya.'); }
}

function addMsg(m){
  if(msgsEl.querySelector(`[data-mid="${m.id}"]`)) return;
  const e = msgsEl.querySelector('.empty'); if(e) e.remove();
  const b = buildBubble(m); b.dataset.mid = m.id;
  msgsEl.appendChild(b); toBottom();
  if(!lastTs || new Date(m.created_at) > new Date(lastTs)) lastTs = m.created_at;
}

async function loadHistory(){
  msgsEl.innerHTML = '<p class="empty">Load ho raha hai...</p>';
  if(!sb){ msgsEl.innerHTML = '<p class="empty">Supabase connect nahi hai.</p>'; return; }
  const { data, error } = await sb.from('messages').select('*').order('created_at', {ascending:true});
  if(error){ msgsEl.innerHTML = '<p class="empty">Chat load nahi ho payi.</p>'; console.error(error); return; }
  msgsEl.innerHTML = '';
  if(!data || !data.length){ msgsEl.innerHTML = EMPTY; lastTs = new Date(0).toISOString(); }
  else { data.forEach(addMsg); lastTs = data[data.length-1].created_at; }
  toBottom();
}

function openChat(){
  loadHistory();
  if(sb && !chatChannel){
    chatChannel = sb.channel('messages-live')
      .on('postgres_changes', {event:'INSERT', schema:'public', table:'messages'}, p => addMsg(p.new))
      .subscribe();
  }
  clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    if(!sb || !lastTs) return;
    const { data, error } = await sb.from('messages').select('*').gt('created_at', lastTs).order('created_at', {ascending:true});
    if(!error && data) data.forEach(addMsg);
  }, 3000);
}
function closeChat(){
  if(chatChannel && sb){ sb.removeChannel(chatChannel); chatChannel = null; }
  clearInterval(pollTimer); pollTimer = null;
}

async function uploadMedia(file){
  const ext = file.name.split('.').pop() || 'dat';
  const path = (identity || 'anon') + '/' + Date.now() + '_' + Math.random().toString(36).slice(2) + '.' + ext;
  const { error } = await sb.storage.from(BUCKET).upload(path, file, {cacheControl:'3600', upsert:false});
  if(error) throw error;
  return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
}

chatForm.addEventListener('submit', async e => {
  e.preventDefault();
  const text = txt.value.trim(), file = pendingFile;
  if(!text && !file) return;
  if(!sb){ alert('Supabase connect nahi hai.'); return; }
  const btn = document.getElementById('sendBtn'); btn.disabled = true;
  try{
    let media_url = null, media_type = null;
    if(file){ media_url = await uploadMedia(file); media_type = file.type.startsWith('video/') ? 'video' : 'image'; }
    const { error } = await sb.from('messages').insert({ sender: identity, content: text || null, media_url, media_type });
    if(error) throw error;
    txt.value = ''; clearPending();
  } catch(err){ console.error(err); alert('Message bhej nahi paya — messages table / chat-media bucket check karo.'); }
  finally { btn.disabled = false; }
});

document.getElementById('chatDelAll').addEventListener('click', async () => {
  if(!sb || !confirm('Poori chat permanently delete karni hai?')) return;
  try{
    const { data: rows, error: fe } = await sb.from('messages').select('media_url').not('media_url', 'is', null);
    if(fe) throw fe;
    const paths = (rows || []).map(r => pathFromUrl(r.media_url)).filter(Boolean);
    if(paths.length) await sb.storage.from(BUCKET).remove(paths);
    const { error } = await sb.from('messages').delete().not('id', 'is', null);
    if(error) throw error;
    msgsEl.innerHTML = EMPTY; lastTs = new Date(0).toISOString();
  } catch(err){ console.error(err); alert('Chat delete nahi ho payi.'); }
});

/* ---------- LIGHTBOX ---------- */
const lb = document.getElementById('lb'), lbC = document.getElementById('lbC');
function openLb(url, type){
  lbC.innerHTML = '';
  const el = document.createElement(type === 'video' ? 'video' : 'img');
  el.src = url;
  if(type === 'video'){ el.controls = true; el.autoplay = true; el.playsInline = true; }
  lbC.appendChild(el); lb.classList.add('show');
}
function closeLb(){ lb.classList.remove('show'); lbC.innerHTML = ''; }
document.getElementById('lbClose').addEventListener('click', closeLb);
lb.addEventListener('click', e => { if(e.target === lb) closeLb(); });
/* refresh par login bana rahe; tab/browser band hote hi localStorage clear -> logout */
try{
  if(localStorage.getItem('kk_logged') === '1' && localStorage.getItem('kk_user')){
    identity = localStorage.getItem('kk_user');
    if(sessionStorage.getItem('kk_screen') === 'chat') show('chat');
  }
}catch(e){}
